<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayti - Login</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/signup.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="signup-page">

        <div class="left-panel">
            <div class="auth-box">

                <div class="brand">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Bayti Logo" class="brand-logo">
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="flash-message {{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <h1>Sign in</h1>

                <form method="POST" action="{{ url_for('login') }}" class="auth-form">
                    <div class="input-group">
                        <input type="email" name="email" placeholder="Email Address" required>
                    </div>

                    <div class="input-group">
                        <input type="password" name="password" placeholder="Password" required>
                    </div>

                    <button type="submit" class="continue-btn">Continue</button>
                </form>

                <p class="switch-text">
                    New to Bayti?
                    <a href="{{ url_for('signup') }}">Create account</a>
                </p>

            </div>
        </div>

        <div class="right-panel">
            <img src="{{ url_for('static', filename='images/signin.jpg') }}" alt="Bayti Home">
            <div class="image-overlay"></div>
        </div>

    </div>

</body>
</html>
